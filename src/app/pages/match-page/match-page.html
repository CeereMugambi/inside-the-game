<a class="back-link" routerLink="/">← Back to home</a>

<app-scoreboard
  [homeTeamName]="match().home"
  [awayTeamName]="match().away"
  [homeScore]="homeGoalCount()"
  [awayScore]="awayGoalCount()"
  [minutePlayed]="lastMinutePlayed()"
  [isFinished]="hasFinished()" />

<app-playback-controls
  [isPlaying]="isPlaying()"
  [revealedCount]="revealedEventCount()"
  [totalCount]="totalEventCount()"
  (actionRequested)="handlePlaybackAction()" />

<div class="match-layout">
  <app-timeline [matchEvents]="visibleEvents()" [shouldFollowLatest]="isPlaying()" />

  <aside class="match-sidebar">
    <app-stats-panel [statistics]="matchStatistics()" />
    <app-language-switcher
      [languageOptions]="languageOptions"
      [selectedLanguageCode]="selectedLanguageCode()"
      (languageSelected)="handleLanguageSelected($event)" />
    <app-commentary-feed [commentaryLines]="visibleCommentaryLines()" />
  </aside>
</div>
